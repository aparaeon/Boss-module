name: Pull Request Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true


jobs:
  build-java:
    if: github.event.head_commit.author.name != 'Build Bot'
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Fetch Secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@v1.3.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: mmorealms
          doppler-config: prod
          inject-env-vars: true

      - name: Reset Working Directory
        run: |
          rm * -rf

      - name: Set JAVA_HOME and update PATH
        run: |
          JAVA_PATH=/root/.sdkman/candidates/java/current
          GRADLE_PATH=/root/.sdkman/candidates/gradle/current
          
          echo "Setting JAVA_HOME to $JAVA_PATH"
          echo "JAVA_HOME=$JAVA_PATH" >> $GITHUB_ENV
          echo "PATH=$JAVA_PATH/bin:$PATH" >> $GITHUB_ENV
          echo "PATH=$GRADLE_PATH/bin:$PATH" >> $GITHUB_ENV

      - name: Setup gradle
        run: |
          echo -e "\n\n\nStopping any running Gradle daemons and clearing lock files...\n\n\n"
          find ~/.gradle -type f -name "*.lock" -delete || true
          gradle --stop

      - name: Run Control Plane
        run: |
          set +e
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          
          REPOSITORY_ID=$(echo "${{ github.repository }}" | cut -d '/' -f 2)
          BRANCH=${{ github.head_ref }}
          
          gh repo clone MMO-REALMS/control-plane -- --recursive
          cd control-plane
          git checkout $BRANCH
          pip3 install -r requirements.txt --break-system-packages
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]
          do
            python3 app.py --debug --get=$REPOSITORY_ID:$BRANCH | grep -v "duplicate input"
            return_code=${PIPESTATUS[0]}
          
            if [ $return_code -eq 0 ]; then
              VERSION=$(cat versions/*.version)
              echo -e "\n\n\nNew version is $VERSION\n\n\n"
              echo "VERSION=$VERSION" >> $GITHUB_ENV
              break
            fi
          
            echo -e "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"
            echo -e "\n\n\nGet version attempt $ATTEMPT failed. Retrying...\n\n\n"
            echo -e "Resetting .gradle cache and refreshing dependencies...\n\n\n"
          
            owd=$(pwd)
            cd tmp/$REPOSITORY_ID
            rm -rf .gradle
            ./gradlew clean --refresh-dependencies | grep -v "duplicate input"
            cd $owd
          
            ATTEMPT=$((ATTEMPT + 1))
            echo -e "\n\n\nBuild and publish attempt $ATTEMPT will start shortly...\n\n\n"
            echo -e "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"
          done
          
          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo -e "\n\n\nBuild and publish failed after $MAX_ATTEMPTS attempts.\n\n\n"
            exit 1
          else
            echo -e "\n\n\nBuild and publish succeeded on attempt $ATTEMPT.\n\n\n"
          fi
          
          set -e