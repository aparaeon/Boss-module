name: Pull Request Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-java:
    if: github.event.head_commit.author.name != 'Build Bot'
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Reset Working Directory
        run: |
          git reset --hard HEAD || true
          git clean -fdx || true
          rm * -rf

      - name: Checkout Repository (With Submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Java project with Gradle
        env:
          GG_MMOREALMS_URL: ${{ secrets.GG_MMOREALMS_URL }}
          GG_MMOREALMS_USERNAME: ${{ secrets.GG_MMOREALMS_USERNAME }}
          GG_MMOREALMS_PASSWORD: ${{ secrets.GG_MMOREALMS_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean build
