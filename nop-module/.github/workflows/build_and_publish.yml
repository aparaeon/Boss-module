name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-deploy:
    if: github.event.head_commit.author.name != 'Build Bot'
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - uses: dopplerhq/secrets-fetch-action@v1.3.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: mmorealms
          doppler-config: prod
          inject-env-vars: true

      - name: Reset Working Directory
        run: |
          git reset --hard HEAD || true
          git clean -fdx || true
          rm * -rf

      - name: Checkout Repository (With Submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ env.MMOREALMS_PAT }}

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Java project with Gradle
        env:
          GG_MMOREALMS_URL: ${{ env.GG_MMOREALMS_URL }}
          GG_MMOREALMS_USERNAME: ${{ env.GG_MMOREALMS_USERNAME }}
          GG_MMOREALMS_PASSWORD: ${{ env.GG_MMOREALMS_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION=$(./gradlew bumpVersion | grep "New version:" | awk '{print $3}')
          ./gradlew clean publish
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Commit and push changes
        run: |
          export HOME=/root/actions-runner
          git config --global user.name "Build Bot"
          git config --global user.email "build-bot@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Automated update from workflow"
          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ env.MMOREALMS_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            ## Release Notes
            
            **Version:** `${{ env.VERSION }}`

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set repository name
        run: echo "REPO_NAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Trigger Internal Library Update
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ env.MMOREALMS_PAT }}" \
          --data '{"event_type": "update-internal-lib-event", "client_payload": {"version": "${{ env.VERSION }}", "library": "${{ env.REPO_NAME }}"}}' \
            https://api.github.com/repos/MMO-REALMS/build-src/dispatches
