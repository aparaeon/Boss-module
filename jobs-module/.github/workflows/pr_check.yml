name: Pull Request Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-java:
    if: github.event.head_commit.author.name != 'Build Bot'
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - uses: dopplerhq/secrets-fetch-action@v1.3.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: mmorealms
          doppler-config: prod
          inject-env-vars: true


      - name: Reset Working Directory
        run: |
          git reset --hard HEAD || true
          git clean -fdx || true
          rm * -rf

      - name: Checkout Repository (With Submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ env.MMOREALMS_PAT }}

      - name: Update Submodules
        run: |
          export HOME=/root/actions-runner
          git submodule update --remote --force
        env:
          GITHUB_TOKEN: ${{ env.MMOREALMS_PAT }}

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup gradle
        run: |
          echo "Making gradlew executable..."
          chmod +x gradlew
          
          echo -e "\n\n\nStopping any running Gradle daemons and clearing lock files...\n\n\n"
          find ~/.gradle -type f -name "*.lock" -delete || true
          ./gradlew --stop
          ./gradlew clean

      - name: Build
        run: |
          set +e
          max_attempts=3
          attempt=1
          
          while [ $attempt -le $max_attempts ]
          do
            echo -e "\n\n\nBuild and publish attempt $attempt...\n\n\n"
          
            ./gradlew build
          
            if [ $? -eq 0 ]; then
              break
            fi
            attempt=$((attempt + 1))
          done
          
          if [ $attempt -gt $max_attempts ]; then
              echo -e "\n\n\nBuild failed after $max_attempts attempts.\n\n\n"
              exit 1
          else
              echo -e "\n\n\nBuild succeeded on attempt $attempt.\n\n\n"
          fi
          set -e
