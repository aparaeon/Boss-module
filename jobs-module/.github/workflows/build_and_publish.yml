name: Build and Publish

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'version.txt'
      - 'buildSrc/**'
      - 'buildSrc'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    if: github.event.head_commit.author.name != 'Build Bot'
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - uses: dopplerhq/secrets-fetch-action@v1.3.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: mmorealms
          doppler-config: prod
          inject-env-vars: true

      - name: Reset Working Directory
        run: |
          git reset --hard HEAD || true
          git clean -fdx || true
          rm * -rf

      - name: Checkout Repository (With Submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ env.MMOREALMS_PAT }}

      - name: Update Submodules
        run: |
          export HOME=/root/actions-runner
          git submodule update --remote --force
        env:
          GITHUB_TOKEN: ${{ env.MMOREALMS_PAT }}

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup gradle
        run: |
          echo "Making gradlew executable..."
          chmod +x gradlew
          
          echo -e "\n\n\nStopping any running Gradle daemons and clearing lock files...\n\n\n"
          find ~/.gradle -type f -name "*.lock" -delete || true
          ./gradlew --stop
          ./gradlew clean

      - name: Bump version, Build, Publish
        run: |
          set +e
          max_attempts=3
          attempt=1
          
          while [ $attempt -le $max_attempts ]
          do
            echo -e "\n\n\nBuild and publish attempt $attempt...\n\n\n"
          
            echo -e "\n\n\nGenerating new version...\n\n\n"
            VERSION=$(./gradlew bumpVersion | grep "New version:" | awk '{print $3}')
          
            find ~/.gradle -type f -name "*.lock" -delete || true
            ./gradlew --stop
            ./gradlew clean --rerun-tasks
            ./gradlew publish --rerun-tasks
            return_code=$?
            if [ $return_code -eq 0 ]; then
              echo -e "\n\n\nNew version is $VERSION\n\n\n"
              echo "VERSION=$VERSION" >> $GITHUB_ENV
              break
            fi
            attempt=$((attempt + 1))
          done
          
          if [ $attempt -gt $max_attempts ]; then
              echo -e "\n\n\nBuild and publish failed after $max_attempts attempts.\n\n\n"
              exit 1
          else
              echo -e "\n\n\nBuild and publish succeeded on attempt $attempt.\n\n\n"
          fi
          set -e

      - name: Commit and push changes
        run: |
          export HOME=/root/actions-runner
          git config --global user.name "Build Bot"
          git config --global user.email "build-bot@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Automated update from workflow"
          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ env.MMOREALMS_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            ## Release Notes
            
            **Version:** `${{ env.VERSION }}`

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set repository name
        run: echo "REPO_NAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Trigger Internal Library Update
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ env.MMOREALMS_PAT }}" \
          --data '{"event_type": "update-internal-libs-event"}' \
            https://api.github.com/repos/MMO-REALMS/build-src/dispatches
